[package]
name = "one_big_script_rs_all_in_one"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
ahash = "0.8.12"
calamine = { version = "0.34.0", features = ["chrono"] }
chrono = { version = "0.4.42", features = ["clock"] }
clap = { version = "4.5.48", features = ["derive"] }
dbase = { version = "0.7.0", features = ["yore"] }
egui = "0.34.1"
eframe = "0.34.1"
encoding_rs = "0.8.35"
once_cell = "1.21.3"
rayon = "1.11.0"
regex = "1.12.2"
raw-window-handle = "0.6.2"
rust_xlsxwriter = "0.94.0"
umya-spreadsheet = "2.3.3"
zip = "2.4.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
mimalloc = "0.1.52"

# Форк 0.94.0 из vendor/: в оригинале уровень сжатия захардкожен, а части книги
# жмутся по очереди в один поток. См. vendor/rust_xlsxwriter/ФОРК.md.
[patch.crates-io]
rust_xlsxwriter = { path = "vendor/rust_xlsxwriter" }
